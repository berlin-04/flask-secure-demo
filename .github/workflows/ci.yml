name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t flask-demo-secure:ci .

      - name: scan vun
        uses: aquasecurity/trivy-action@master
        with:
           image-ref: flask-demo-secure:ci 
           format: table
           exit-code: '0'
           severity: 'CRITICAL,HIGH'
